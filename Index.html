<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniCAD</title>
<style>
:root{--bg:#1b1c20;--pn:#26282e;--bd:#383b44;--tx:#e6e6e6;--ac:#4aa3ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;font:13px system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;flex-wrap:wrap;gap:4px;padding:5px;background:var(--pn);border-bottom:1px solid var(--bd);align-items:center}
button{background:#33363f;color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;cursor:pointer;font:inherit}
button:hover{background:#40444f}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#mid{flex:1;display:flex;min-height:0}
#tb{width:92px;background:var(--pn);border-right:1px solid var(--bd);padding:5px;display:flex;flex-direction:column;gap:4px;overflow:auto}
#cw{flex:1;min-width:0;position:relative}#cv{display:block;width:100%;height:100%;cursor:crosshair}
#pp{width:190px;background:var(--pn);border-left:1px solid var(--bd);padding:8px;overflow:auto;line-height:1.5}
#cb{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--pn);border-top:1px solid var(--bd)}
#hint{color:#9bd;white-space:nowrap}#cmd{flex:1;background:#15161a;color:var(--tx);border:1px solid var(--bd);padding:5px;font:inherit;min-width:60px}
#st{padding:3px 8px;background:#15161a;color:#aaa;font-size:12px;border-top:1px solid var(--bd)}
h4{margin:8px 0 4px;color:#9bd}input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--bd);background:none}
#tip{position:fixed;display:none;z-index:9;max-width:250px;background:#0d0e11;border:1px solid var(--ac);border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.4;pointer-events:none;box-shadow:0 4px 14px #000a}#tip .k{background:#33363f;border-radius:3px;padding:0 5px;margin-left:4px;color:#9bd}
@media(max-width:700px){#pp{display:none}#tb{width:70px}}

/* ===== HUD renovada: hierarquia visual e navegação ===== */
:root{--bg:#171a21;--pn:#202630;--bd:#354152;--tx:#edf3fb;--ac:#3b9cff;--mut:#9eafc3;--panel:#252e3b}
html,body{font:13px Inter,system-ui,sans-serif}
#top{gap:7px;padding:8px 12px;background:#202630;border-bottom:1px solid #3b4656;box-shadow:0 2px 12px #0004;z-index:2}
#top button{padding:7px 11px;border-radius:6px;font-weight:550;white-space:nowrap}
#top button:nth-child(4){margin-left:8px}
#top button:nth-child(7){margin-left:8px}
#top button.on{box-shadow:0 0 0 1px #8bc8ff66 inset}
#mid{background:#11151c}
#tb{width:178px;min-width:178px;padding:10px 8px;background:#202630;border-right:1px solid #3b4656;gap:5px}
#tb .tool-heading{padding:10px 7px 3px;color:#8fa6c0;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
#tb button{width:100%;text-align:left;padding:8px 9px;border:1px solid transparent;border-radius:6px;background:transparent;color:#d7e1ee;display:flex;align-items:center;gap:8px}
#tb button:before{content:attr(data-short);width:24px;height:23px;display:inline-grid;place-items:center;border-radius:5px;background:#303c4d;color:#a9cfff;font-size:10px;font-weight:800;flex:none}
/* Evita que abreviações longas invadam o texto dos botões. */
#tb button::before{min-width:24px;max-width:24px;overflow:hidden;white-space:nowrap;text-overflow:clip;flex:0 0 24px}
#tb button{min-width:0;overflow:hidden}
#tb button{white-space:normal}
#tb button{line-height:1.35}
#tb button{overflow-wrap:anywhere}
#tb button:hover{background:#2b3543;border-color:#3b4b60}
#tb button.on{background:#174b78;border-color:#347fbd;color:white}
#tb button.on:before{background:#287ec1;color:white}
#cw{background-color:#151b24}
#pp{width:250px;min-width:230px;padding:14px;background:#202630;border-left:1px solid #3b4656;color:#dce6f2}
#pp h4{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#8fc7ff;margin:12px 0 7px;padding-bottom:5px;border-bottom:1px solid #354152}
#pp h4:first-child{margin-top:0}
#pp button{margin-top:6px;background:#30445a;border-color:#46617d}
#pp input{background:#151c26;color:#fff;border:1px solid #46566b;border-radius:5px;padding:5px}
#cb{padding:8px 12px;gap:10px;background:#202630;border-top:1px solid #3b4656}
#hint{min-width:210px;color:#9fd0ff;font-weight:650}
#cmd{height:34px;border-radius:6px;padding:7px 10px;background:#121923;border-color:#40516a}
#cmd:focus{outline:2px solid #3b9cff66;border-color:#3b9cff}
#st{padding:6px 12px;background:#111720;color:#aebed0;font-size:11px}
#tip{background:#111923;border-color:#3b9cff;color:#eaf4ff}
button:focus-visible{outline:2px solid #83c5ff;outline-offset:2px}
@media(max-width:900px){#tb{width:150px;min-width:150px}#pp{width:210px;min-width:190px}#hint{min-width:150px}}
@media(max-width:700px){#tb{width:125px;min-width:125px}#pp{display:none}#top{gap:4px;padding:6px}#top button{padding:6px 8px}#hint{min-width:0;max-width:40%;white-space:normal}}


/* Correção final do painel lateral: não comprimir nem cortar os últimos itens. */
#tb{
  align-items:stretch;
  overflow-x:hidden;
  overflow-y:auto;
  min-height:0;
  gap:5px;
}
#tb .tool-heading{
  flex:0 0 auto;
  min-height:24px;
}
#tb button{
  flex:0 0 auto;
  min-height:38px;
  height:auto;
  white-space:nowrap;
  overflow:visible;
  overflow-wrap:normal;
  text-overflow:clip;
}
#tb button::before{
  flex:0 0 30px;
  width:30px;
  min-width:30px;
  max-width:30px;
  height:23px;
}

</style></head><body>
<div id="app">
<div id="top">
<button onclick="novo()">Novo</button><button onclick="$('fi').click()">Abrir</button><button onclick="salvar()">Salvar</button>
<button onclick="dl('desenho.dxf',dxf())">Exportar DXF</button><button onclick="dl('desenho.svg',svg())">Exportar SVG</button>
<button onclick="undo()">Desfazer</button><button onclick="redo()">Refazer</button><button onclick="fit()">Zoom total</button><button onclick="centralizar()">Centralizar</button>
<button id="bg" onclick="tg('grid')">Grade F7</button><button id="bs" onclick="tg('snap')">Snap F9</button><button id="bo" onclick="tg('ortho')">Orto F8</button>
<span style="color:#aebed0;font-weight:600;margin-left:6px">Cor</span> <input type="color" id="col" value="#ffffff"><input type="file" id="fi" hidden accept=".json">
</div>
<div id="mid"><div id="tb"></div><div id="cw"><canvas id="cv"></canvas></div><div id="pp"></div></div>
<div id="cb"><span id="hint"></span><input id="cmd" placeholder="Digite um comando (ex.: L, C, REC) ou coordenada: x,y · @dx,dy · dist<ang" autocomplete="off"></div>
<div id="st"></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),cmd=$('cmd');
let S=[],sel=new Set(),U=[],R=[],tool='sel',pts=[],mouse={x:0,y:0},V={s:3,ox:40,oy:400},dpr=1,on={grid:1,snap:1,ortho:0,os:1,polar:0,trk:0},color='#ffffff',pan=null,box=null;
const T=[['sel','Selecionar'],['line','Linha'],['pline','Polilinha'],['rect','Retângulo'],['circle','Círculo'],['dim','Cota'],['text','Texto'],['move','Mover'],['erase','Apagar'],['pan','Mão']];
const AL={s:'sel',l:'line',pl:'pline',rec:'rect',c:'circle',dim:'dim',t:'text',m:'move',e:'erase',h:'pan'};
const NM={selecionar:'sel',linha:'line',polilinha:'pline','retângulo':'rect',retangulo:'rect','círculo':'circle',circulo:'circle',cota:'dim',texto:'text',mover:'move',apagar:'erase',mao:'pan','mão':'pan'};
const HT={sel:['Clique num objeto (Shift soma) ou arraste uma janela'],line:['Primeiro ponto','Próximo ponto (botão direito/Enter termina)'],pline:['Primeiro ponto','Próximo ponto (Enter ou botão direito termina)'],rect:['Primeiro canto','Canto oposto'],circle:['Centro','Raio (clique ou digite)'],dim:['Primeiro ponto','Segundo ponto','Posição da linha de cota'],text:['Clique onde inserir o texto'],move:['Ponto base (selecione antes)','Ponto de destino'],erase:['Clique no objeto a apagar'],pan:['Arraste para mover a vista']};
const w2s=(x,y)=>[V.ox+x*V.s,V.oy-y*V.s],s2w=(x,y)=>[(x-V.ox)/V.s,(V.oy-y)/V.s];
const D=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]),f=n=>(+n).toFixed(3);
function sd(p,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function dg(o){let L=D(o.a,o.b)||1,nx=-(o.b[1]-o.a[1])/L,ny=(o.b[0]-o.a[0])/L,a2=[o.a[0]+nx*o.off,o.a[1]+ny*o.off],b2=[o.b[0]+nx*o.off,o.b[1]+ny*o.off];
 return{L:D(o.a,o.b),a2,b2,m:[(a2[0]+b2[0])/2,(a2[1]+b2[1])/2],ang:Math.atan2(o.b[1]-o.a[1],o.b[0]-o.a[0])}}
function segs(o){if(o.t=='line')return[[o.a,o.b]];if(o.t=='poly'){let r=[];for(let i=0;i<o.p.length-1;i++)r.push([o.p[i],o.p[i+1]]);if(o.cl)r.push([o.p[o.p.length-1],o.p[0]]);return r}
 if(o.t=='dim'){let d=dg(o);return[[o.a,d.a2],[d.a2,d.b2],[d.b2,o.b]]}return[]}
function dist(o,p){if(o.t=='arc'){if(nm(Math.atan2(p[1]-o.c[1],p[0]-o.c[0])-o.a0)<=span(o))return Math.abs(D(p,o.c)-o.r);return Math.min(D(p,gl(o)[1]),D(p,gl(o)[2]))}if(o.t=='circle')return Math.abs(D(p,o.c)-o.r);
 if(o.t=='text')return(p[0]>=o.a[0]&&p[0]<=o.a[0]+o.s.length*o.h*.55&&p[1]>=o.a[1]-o.h*.2&&p[1]<=o.a[1]+o.h)?0:1e9;
 return Math.min(...segs(o).map(s=>sd(p,s[0],s[1])))}
function kp(o){if(o.t=='line')return[o.a,o.b,[(o.a[0]+o.b[0])/2,(o.a[1]+o.b[1])/2]];if(o.t=='poly')return o.p;
 if(o.t=='circle'){let[x,y]=o.c,r=o.r;return[o.c,[x+r,y],[x-r,y],[x,y+r],[x,y-r]]}if(o.t=='arc'){let g3=gl(o),m=o.a0+span(o)/2;return[...g3,[o.c[0]+o.r*Math.cos(m),o.c[1]+o.r*Math.sin(m)]]}if(o.t=='text')return[o.a];let d=dg(o);return[o.a,o.b,d.a2,d.b2]}
function hit(p){let tol=8/V.s,b=null,bd=tol;for(const o of S){if(!vis(o))continue;let d=dist(o,p);if(d<bd){bd=d;b=o}}return b}
function area(p){let a=0;for(let i=0;i<p.length;i++){let q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a/2)}
function info(o){if(o.t=='line')return`Linha<br>Comprimento: ${f(D(o.a,o.b))}<br>Ângulo: ${f(Math.atan2(o.b[1]-o.a[1],o.b[0]-o.a[0])*180/Math.PI)}°`;
 if(o.t=='circle')return`Círculo<br>Raio: ${f(o.r)}<br>Perímetro: ${f(2*Math.PI*o.r)}<br>Área: ${f(Math.PI*o.r*o.r)}`;
 if(o.t=='poly'){let P=segs(o).reduce((s,x)=>s+D(x[0],x[1]),0);return`${o.cl?'Polígono':'Polilinha'} (${o.p.length} pts)<br>Perímetro: ${f(P)}`+(o.cl?`<br>Área: ${f(area(o.p))}`:'')}
 if(o.t=='dim')return`Cota<br>Valor: ${f(D(o.a,o.b))}`;if(o.t=='arc')return`Arco<br>Raio: ${f(o.r)}<br>Ângulo: ${f(span(o)*180/Math.PI)}°<br>Comprimento: ${f(o.r*span(o))}`;return`Texto: ${o.s}`}
function snapSave(){U.push(JSON.stringify(S));if(U.length>100)U.shift();R=[]}
function undo(){if(!U.length)return;R.push(JSON.stringify(S));S=JSON.parse(U.pop());sel.clear();pts=[];upd()}
function redo(){if(!R.length)return;U.push(JSON.stringify(S));S=JSON.parse(R.pop());sel.clear();upd()}
function build(t,Q){let a=Q[0],b=Q[1];
 if(t=='line'&&b)return{t:'line',a,b};if(t=='pline'&&b)return{t:'poly',p:Q,cl:0};
 if(t=='rect'&&b)return{t:'poly',p:[a,[b[0],a[1]],b,[a[0],b[1]]],cl:1};
 if(t=='circle'&&b){let r=D(a,b);return r>0?{t:'circle',c:a,r}:null}
 if(t=='dim'&&b){let c=Q[2];if(!c)return{t:'line',a,b};let L=D(a,b)||1;return{t:'dim',a,b,off:((c[0]-a[0])*-(b[1]-a[1])+(c[1]-a[1])*(b[0]-a[0]))/L}}return null}
function mvO(o,d){for(const k of['a','b','c'])if(o[k])o[k]=[o[k][0]+d[0],o[k][1]+d[1]];if(o.p)o.p=o.p.map(q=>[q[0]+d[0],q[1]+d[1]])}
function click(p){const t=tool;
 if(t=='erase'){let h=hit([p.rx??p.x,p.ry??p.y]);if(h){snapSave();S.splice(S.indexOf(h),1);sel.delete(h)}return upd()}
 if(t=='text'){let s=prompt('Texto:');if(s){snapSave();S.push({t:'text',a:[p.x,p.y],s,h:+(16/V.s).toPrecision(2),col:color,ly:CL})}return upd()}
 if(t=='move'){if(!sel.size)return msg('Selecione objetos antes de mover');if(!pts.length)pts=[[p.x,p.y]];
  else{let d=[p.x-pts[0][0],p.y-pts[0][1]];snapSave();sel.forEach(o=>mvO(o,d));pts=[]}return upd()}
 if(t=='trim'){trim([p.rx??p.x,p.ry??p.y]);return}
 if(t=='ed'){let h=hit([p.rx??p.x,p.ry??p.y]);if(h)editPrompt(h);return}
 if(t=='measure'){pts.push([p.x,p.y]);if(pts.length==2){let a=pts[0],b=pts[1];pts=[];upd();msg(`Distância ${D(a,b).toFixed(3)} · Δx ${(b[0]-a[0]).toFixed(3)} · Δy ${(b[1]-a[1]).toFixed(3)} · ∠ ${(Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI).toFixed(2)}°`)}else upd();return}
 if(['copy','rotate','mirror','scale'].includes(t)){if(!sel.size)return msg('Selecione objetos antes');
  if(t=='copy'){if(!pts.length)pts=[[p.x,p.y]];else{let d=[p.x-pts[0][0],p.y-pts[0][1]];snapSave();[...sel].forEach(o=>{let c=JSON.parse(JSON.stringify(o));mvO(c,d);S.push(c)})}}
  else if(t=='rotate'){if(!pts.length)pts=[[p.x,p.y]];else return doRot(Math.atan2(p.y-pts[0][1],p.x-pts[0][0]))}
  else if(t=='scale'){let k=parseFloat((prompt('Fator de escala:','2')||'').replace(',','.'));if(k>0)applyXf(q=>[p.x+(q[0]-p.x)*k,p.y+(q[1]-p.y)*k],k,0,0)}
  else{pts.push([p.x,p.y]);if(pts.length==2){let a=pts[0],b=pts[1],L=D(a,b);if(L>0){let dx=(b[0]-a[0])/L,dy=(b[1]-a[1])/L;applyXf(q=>{let vx=q[0]-a[0],vy=q[1]-a[1],pr=vx*dx+vy*dy;return[a[0]+2*pr*dx-vx,a[1]+2*pr*dy-vy]},1,1,1)}pts=[]}}
  return upd()}
 if(t=='sel'||t=='pan')return;
 pts.push([p.x,p.y]);if(t=='pline')return upd();
 const N={line:2,rect:2,circle:2,dim:3};
 if(pts.length==N[t]){let o=build(t,pts);if(o&&!(t=='line'&&D(pts[0],pts[1])==0)){snapSave();o.col=color;o.ly=CL;S.push(o)}pts=t=='line'?[pts[1]]:[]}
 upd()}
function fin(){if(tool=='pline'&&pts.length>1){let o=build('pline',pts);snapSave();o.col=color;o.ly=CL;S.push(o)}pts=[];upd()}
function setTool(t){tool=t;pts=[];[...$('tb').children].forEach(b=>b.classList.toggle('on',b.dataset.t==t));cv.style.cursor=t=='pan'?'grab':'crosshair';upd()}
function parseIn(v){let L=pts[pts.length-1],m;
 if(m=v.match(/^(@?)(-?[\d.]+)[,;]\s*(-?[\d.]+)$/)){let x=+m[2],y=+m[3];if(m[1]&&L){x+=L[0];y+=L[1]}return[x,y]}
 if((m=v.match(/^@?(-?[\d.]+)<(-?[\d.]+)$/))&&L){let d=+m[1],a=+m[2]*Math.PI/180;return[L[0]+d*Math.cos(a),L[1]+d*Math.sin(a)]}
 if((m=v.match(/^-?[\d.]+$/))&&L){let d=+v,a=Math.atan2(mouse.y-L[1],mouse.x-L[0]);return[L[0]+d*Math.cos(a),L[1]+d*Math.sin(a)]}return null}
function run(v){v=v.trim().toLowerCase();if(!v)return fin();let t=AL[v]||NM[v];if(t)return setTool(t);
 if(v=='z')return fit();if(v=='ce')return centralizar();if(tool=='rotate'&&pts.length&&/^-?[\d.]+$/.test(v))return doRot(+v*Math.PI/180);if(v=='u')return undo();let p=parseIn(v);if(p)click({x:p[0],y:p[1]});else msg('Comando desconhecido: '+v)}
function pick(e){let r=cv.getBoundingClientRect(),w=s2w(e.clientX-r.left,e.clientY-r.top),raw=w.slice(),b=null,bd=12/V.s;
 if(on.os){for(const o of S)if(!SK.has(o)&&vis(o))for(const q of kp(o)){let d=D(q,w);if(d<bd){bd=d;b=q}}if(b){TKA(b);return{x:b[0],y:b[1],rx:raw[0],ry:raw[1],m:1}}}
 let L=pts[pts.length-1];if(on.ortho&&L){if(Math.abs(w[0]-L[0])>Math.abs(w[1]-L[1]))w[1]=L[1];else w[0]=L[0]}
 if(!PT(w,L)&&on.snap){let st=gst();w=[Math.round(w[0]/st)*st,Math.round(w[1]/st)*st]}
 return{x:w[0],y:w[1],rx:raw[0],ry:raw[1]}}
function gst(){for(const s of[1,2,5,10,20,50,100,200,500,1000,5000,1e4,1e5])if(s*V.s>=9)return s;return 1e6}
function ds(o){const P=q=>w2s(q[0],q[1]);g.beginPath();
 if(o.t=='line'){g.moveTo(...P(o.a));g.lineTo(...P(o.b));g.stroke()}
 else if(o.t=='poly'){o.p.forEach((q,i)=>i?g.lineTo(...P(q)):g.moveTo(...P(q)));if(o.cl)g.closePath();g.stroke()}
 else if(o.t=='circle'){let c=P(o.c);g.arc(c[0],c[1],o.r*V.s,0,7);g.stroke()}
 else if(o.t=='arc'){let c=P(o.c);g.arc(c[0],c[1],o.r*V.s,-o.a0,-o.a1,true);g.stroke()}
 else if(o.t=='text'){let a=P(o.a);g.font=Math.max(4,o.h*V.s)+'px sans-serif';g.textAlign='left';g.fillText(o.s,a[0],a[1])}
 else{let d=dg(o);g.moveTo(...P(o.a));g.lineTo(...P(d.a2));g.lineTo(...P(d.b2));g.lineTo(...P(o.b));g.stroke();
  let m=P(d.m),an=-d.ang;if(Math.cos(an)<0)an+=Math.PI;g.save();g.translate(m[0],m[1]);g.rotate(an);g.font='12px sans-serif';g.textAlign='center';g.fillText(d.L.toFixed(2),0,-4);g.restore()}}
function draw(){const W=cv.clientWidth,H=cv.clientHeight;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 if(on.grid){let st=gst(),a=s2w(0,H),b=s2w(W,0);g.fillStyle='#3d414c';
  for(let x=Math.ceil(a[0]/st)*st;x<=b[0];x+=st)for(let y=Math.ceil(a[1]/st)*st;y<=b[1];y+=st){let p=w2s(x,y);g.fillRect(p[0],p[1],1.5,1.5)}}
 let z=w2s(0,0);g.lineWidth=1;g.strokeStyle='#a44';g.beginPath();g.moveTo(0,z[1]);g.lineTo(W,z[1]);g.stroke();g.strokeStyle='#4a4';g.beginPath();g.moveTo(z[0],0);g.lineTo(z[0],H);g.stroke();
 for(const o of S){if(!vis(o))continue;let s=sel.has(o);g.strokeStyle=g.fillStyle=s?'#4aa3ff':o.col;g.lineWidth=s?2.5:1.5;ds(o)}
